            }
          },
          "429": {
            "description": "Rate limited",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "offset",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 100000,
              "default": 0
            }
          },
          {
            "name": "from",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "to",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "department",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9-]{0,31}$"
            }
          },
          {
            "name": "agent",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]{3}$"
            }
          },
          {
            "name": "outcome",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "created",
                "ringing",
                "answered",
                "abandoned",
                "timeout",
                "closed",
                "unavailable",
                "busy",
                "rejected",
                "failed",
                "not_answered",
                "interrupted"
              ]
            }
          }
        ],
        "description": "Período de início da chamada: from inclusivo, to exclusivo. Resultado filtrado por tenant. Department e agent usam a classificação principal da chamada; o detalhe retorna passagens adicionais. Atendente vê chamadas próprias; supervisor vê o departamento principal delegado; administrador vê seu tenant."
      }
    },
