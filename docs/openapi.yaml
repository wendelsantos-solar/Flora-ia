          "lines": {
            "type": "array",
            "maxItems": 3,
            "items": {
              "type": "string",
              "pattern": "^2[01][12]$"
            }
          }
        },
        "required": [
          "enabled",
          "trunk_enabled",
          "inbound_did",
          "inbound_target",
          "tenant_limit",
          "trunk_limit",
          "line_limit",
          "attempts",
          "seconds",
          "allowed",
          "blocked",
          "lines"
        ]
      }
    }
  }
}
