[flora-sip-lab-out]
; Patterns are generated from fixed digit lengths in the lab provisioning script.

[flora-sip-lab-dial]
exten => _[+0-9].,1,Gosub(flora-sip-lab-gate,s,1(out,${FLORA_LINE},${EXTEN}))
 same => n,Dial(PJSIP/${FLORA_TARGET}@simulator,${FLORA_RING},iS(${FLORA_LIMIT}))
 same => n,Hangup()

[flora-sip-lab-in]
exten => _880XXXXXXX,1,Gosub(flora-sip-lab-gate,s,1(in,,${EXTEN}))
 same => n,Goto(internal-only,${FLORA_TARGET},1)

[flora-sip-lab-gate]
exten => s,1,Set(FLORA_TARGET=)
 same => n,Set(FLORA_LIMIT=)
 same => n,Set(CHANNEL(accountcode)=${PBX_TENANT})
 same => n,Set(AGISIGHUP=no)
 same => n,AGI(/opt/flora/gate.py,reserve,${UNIQUEID},${ARG1},${ARG2},${ARG3})
 same => n,GotoIf($["${AGISTATUS}"="SUCCESS" & "${FLORA_TARGET}"!="" & "${FLORA_LIMIT}"!=""]?permit)
 same => n,Hangup(21)
 same => n(permit),Set(FLORA_RING=8)
 same => n,Set(TIMEOUT(absolute)=${FLORA_LIMIT})
 same => n,Set(CHANNEL(hangup_handler_push)=flora-sip-lab-finish,s,1(${UNIQUEID}))
 same => n,Return()

[flora-sip-lab-finish]
exten => s,1,AGI(/opt/flora/gate.py,finish,${ARG1},${DIALSTATUS},${ANSWEREDTIME})
 same => n,Return()
