[general]
enabled=yes
webenabled=no
port=5039
bindaddr=127.0.0.1
timestampevents=yes
[observer]
secret=${AMI_PASSWORD}
allowmultiplelogin=no
read=call,system,reporting
write=reporting,system

; Local controller only. Never publish the manager socket.
[queue-controller]
secret=${QUEUE_AMI_PASSWORD}
allowmultiplelogin=no
displayconnects=no
read=agent,reporting
write=agent,reporting,system
