[global]
type=global
user_agent=Flora-Development
endpoint_identifier_order=username

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[internal](!)
type=endpoint
transport=transport-wss
from_domain=localhost
context=internal-only
disallow=all
allow=ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
allow_transfer=yes
set_var=TRANSFER_CONTEXT=internal-only
rtp_symmetric=yes
rtp_timeout=30
rtp_timeout_hold=60
force_rport=yes
rewrite_contact=yes
media_address=${MEDIA_ADDRESS}
set_var=TENANT_ID=${PBX_TENANT}
accountcode=${PBX_TENANT}
dtmf_mode=rfc4733

[${EXT_A}](internal)
auth=auth${EXT_A}
aors=${EXT_A}
callerid=Ramal ${EXT_A} <${EXT_A}>
[auth${EXT_A}]
type=auth
auth_type=userpass
username=${EXT_A}
password=${SIP_A_PASSWORD}
[${EXT_A}]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=10

[${EXT_B}](internal)
auth=auth${EXT_B}
aors=${EXT_B}
callerid=Ramal ${EXT_B} <${EXT_B}>
[auth${EXT_B}]
type=auth
auth_type=userpass
username=${EXT_B}
password=${SIP_B_PASSWORD}
[${EXT_B}]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=10

[${EXT_C}](internal)
auth=auth${EXT_C}
aors=${EXT_C}
callerid=Ramal ${EXT_C} <${EXT_C}>
[auth${EXT_C}]
type=auth
auth_type=userpass
username=${EXT_C}
password=${SIP_C_PASSWORD}
[${EXT_C}]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=10
