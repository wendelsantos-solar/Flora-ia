[general]
static=yes
writeprotect=yes

[internal-only]
include => flora-queues-demo
exten => _${EXT_PREFIX}[123],1,NoOp(Internal development call)
 same => n,Set(CHANNEL(accountcode)=${PBX_TENANT})
 same => n,GotoIf($["${CALLERID(num)}" = "${EXTEN}"]?denied)
 same => n,Set(GROUP()=internal)
 same => n,GotoIf($[${GROUP_COUNT(internal)} > 2]?denied)
 same => n,Dial(PJSIP/${EXTEN},45,i)
 same => n,Hangup()
 same => n(denied),Hangup(21)

#include /var/spool/flora-config/routes.conf
