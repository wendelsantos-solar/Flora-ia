events {}
http {
  access_log off;
  log_format sip_upgrade 'sip_wss port=$server_port status=$status upstream=$upstream_status tls=$ssl_protocol elapsed=$request_time';
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  ssl_certificate /run/flora/leaf.pem;
  ssl_certificate_key /run/flora/leaf-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 120s;

  server {
    listen 443 ssl;
    server_name lab.flora.test;
    location / { proxy_pass http://web:3000; }
  }
  server {
    listen 8443 ssl;
    server_name lab.flora.test;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/flora/root.crt;
    proxy_ssl_server_name on;
    proxy_ssl_name lab.flora.test;
    location = /ws {
      access_log /dev/stdout sip_upgrade;
      if ($http_origin != "https://lab.flora.test") { return 403; }
      proxy_pass https://asterisk:8089/ws;
    }
    location / { return 404; }
  }
  server {
    listen 8444 ssl;
    server_name lab.flora.test;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /run/flora/root.crt;
    proxy_ssl_server_name on;
    proxy_ssl_name lab.flora.test;
    location = /ws {
      access_log /dev/stdout sip_upgrade;
      if ($http_origin != "https://lab.flora.test") { return 403; }
      proxy_pass https://asterisk-b:8089/ws;
    }
    location / { return 404; }
  }
}
